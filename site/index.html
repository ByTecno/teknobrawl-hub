<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeknoBrawl">
<title>TeknoBrawl Hub</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#hoy" aria-label="TeknoBrawl Hub, inicio">
      <img src="/icons/icon-192.png" alt="" width="28" height="28">
      <span>TeknoBrawl <b>Hub</b></span>
    </a>
    <nav class="tabs" id="tabs-top" aria-label="Secciones"></nav>
    <div class="top-actions">
      <button class="fresh" id="fresh" type="button" aria-haspopup="dialog" title="Estado de los datos">
        <span class="dot"></span><span class="fresh-txt">Cargando…</span>
      </button>
      <button class="icon-btn" id="theme" type="button" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="sheet" id="status-sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="status-title">
    <div class="sheet-head"><h2 id="status-title">Estado de los datos</h2><button class="icon-btn" data-close type="button" aria-label="Cerrar">✕</button></div>
    <div id="status-body"></div>
    <div class="sheet-foot">
      <button class="btn" id="reload" type="button">Recargar datos</button>
      <span class="muted small" id="who"></span>
      <a class="small" href="/auth/logout">Cerrar sesión</a>
    </div>
  </div>
</div>

<main id="main">
  <section class="view" id="view-hoy" data-tab="hoy"></section>
  <section class="view" id="view-semana" data-tab="semana" hidden></section>
  <section class="view" id="view-mes" data-tab="mes" hidden></section>
  <section class="view" id="view-analisis" data-tab="analisis" hidden></section>
  <section class="view" id="view-calendario" data-tab="calendario" hidden></section>
</main>

<nav class="bottom" id="tabs-bottom" aria-label="Secciones"></nav>

<script src="/app.js"></script>
</body>
</html>
