<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TeknoBrawl Hub</title>
<style>
  :root { --bg:#f6f6f8; --fg:#1b1b1f; --muted:#6b6b76; --card:#fff; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121216; --fg:#ececf1; --muted:#9a9aa6; --card:#1d1d23; --ok:#4cc26b; --bad:#ef6b6b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .status { font-weight:600; margin-bottom:8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:.85rem; margin:0; }
</style>
</head>
<body>
<main>
  <h1>TeknoBrawl Hub</h1>
  <p class="sub">Página de prueba de la fase 1: lee un JSON que escribe GitHub Actions.</p>
  <div class="card">
    <div id="status" class="status">Cargando…</div>
    <pre id="out"></pre>
  </div>
</main>
<script>
  (async () => {
    const st = document.getElementById("status"), out = document.getElementById("out");
    try {
      const r = await fetch("/api/test.json", { cache: "no-store" });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      const mins = Math.round((Date.now() - Date.parse(data.updated_at)) / 60000);
      st.textContent = `✔ Datos recibidos (actualizados hace ${mins} min)`;
      st.className = "status ok";
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      st.textContent = "✖ No se pudieron leer los datos: " + e.message;
      st.className = "status bad";
    }
  })();
</script>
</body>
</html>
