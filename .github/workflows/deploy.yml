name: Desplegar web

on:
  push:
    branches: [main]
    paths: ["site/**", "functions/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inyectar id de KV
        env:
          KV_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" wrangler.toml
      - name: Desplegar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --project-name teknobrawl-hub --branch main --commit-dirty=true
